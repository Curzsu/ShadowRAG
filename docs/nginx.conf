# 以下为前端编译发布后nginx配置的相关代码片段
server {
  listen 8080;

  location / {
    # Replace this path with the frontend build output on your deployment host.
    root D:/PaiSmart/frontend/dist;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  location = /api/v1/chat/stream {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    send_timeout 90s;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8081;
  }

  # Backend diagnostic page and its browser-native SSE transport.
  location = /test.html {
    proxy_pass http://127.0.0.1:8081;
  }
  location = /chat-stream.mjs {
    proxy_pass http://127.0.0.1:8081;
  }
  location /static/ {
    proxy_pass http://127.0.0.1:8081;
  }
}
