name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── 后端：纯单元测试（不依赖任何外部服务，跑得最快、必定稳定）─────────
  backend-unit:
    name: Backend · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unit tests (no infra required)
        run: mvn -B test -Dtest='ParseServiceUnitTest,ConversationCompressionServiceTest,UserServiceTest'

  # ── 后端：集成测试（需要 MySQL / Redis / Kafka 的 @SpringBootTest 用例）─
  backend-integration:
    name: Backend · integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: PaiSmart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
      kafka:
        image: bitnamilegacy/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: 0
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
          KAFKA_CFG_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        options: >-
          --health-cmd="kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval=30s --health-timeout=10s --health-retries=5 --health-start-period=60s
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # UploadServicePerformanceTest 用 @ActiveProfiles("test")，
      # 因此集成测试统一走 test profile（见 src/main/resources/application-test.yml）
      - name: Run integration tests (test profile)
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B test -Dtest='ParseServiceTest,UploadServicePerformanceTest'

  # ── 前端：lint + 类型检查 + 构建 ──────────────────────────────────────
  frontend:
    name: Frontend · lint / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
