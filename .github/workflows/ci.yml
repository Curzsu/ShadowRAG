name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      # Includes local HTTP/SSE, concurrency and resource tests without paid models.
      # Full application startup needs real infrastructure; see docs/ci.md.
      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress verify '-Dtest=*,!SmartPaiApplicationTests'

      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backend package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org

      - name: Lint without modifying source
        run: pnpm lint:check

      # Vite generates the ignored auto-imports.d.ts and components.d.ts files.
      # A fresh checkout needs these declarations before vue-tsc can run.
      - name: Build production frontend
        run: pnpm build

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Test chat and static SSE clients
        run: pnpm test:chat

      - name: Upload frontend package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
