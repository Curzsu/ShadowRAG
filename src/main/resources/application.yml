mineru:
  api:
    url: http://localhost:8000      # MinerU API 地址
    timeout: 300                    # 超时秒数（大文件解析慢）
    enabled: true                   # true=MinerU解析，false=回退Tika

embedding:
  api:
    url: http://localhost:11434/v1  # Ollama 本地服务（OpenAI 兼容格式）
    key: ollama  # Ollama 不需要认证，但 WebClientConfig 需要 Bearer 头，填任意值即可
    model: bge-m3  # BAAI/bge-m3: 多语言 embedding 模型，1024维
    batch-size: 10  # 单次请求最大行数
    dimension: 1024  # bge-m3 输出向量维度

ai:
  prompt:
    rules: |
      你是 Brain.ai 知识助手。

      回答规范：
      1. 用简体中文回答，先给结论再展开论述。
      2. <<REF>> 与 <<END>> 之间为检索到的参考信息。若参考信息与问题相关，严格基于参考信息作答，不得编造参考信息中未提及的内容；引用时标注来源，格式：(来源: 文件名)。
      3. 若用户的问题属于通用知识（如数学计算、常识问答、闲聊等），不需要参考信息，直接用你的知识回答即可。
      4. 只有当问题明确涉及文档或知识库内容，但参考信息不足以回答时，才告知"暂无相关信息"，并简要说明缺少哪方面信息。
      5. 回答长度应与问题复杂度匹配，简单问题简短作答，复杂问题再详细展开。
    ref-start: "<<REF>>"
    ref-end: "<<END>>"
    no-result-text: "（本轮无检索结果）"
  generation:
    temperature: 0.3
    max-tokens: 4096
    top-p: 0.9
